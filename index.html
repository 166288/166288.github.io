  <script>
    function navPage() {
      return {
        theme: 'light',
        menuOpen: false,
        wechatCopied: false,
        wechatId: '1662884868',
        weather: { temp: '--', desc: '加载中', icon: '🌤' },

        navItems: [
          // 第一排 · 外网
          { name: 'home',       url: 'https://166288.xyz',              icon: '🏠' },
          { name: 'Gitea',      url: 'https://git.166288.xyz',          icon: '🍵' },
          { name: 'Trilium',    url: 'http://frp-six.com:28308/',       icon: '🌳' },
          { name: 'Fnos',       url: 'https://fnos.net/fsuici',         icon: '🐮' },
          { name: 'Deepseek',   url: 'https://chat.deepseek.com/',      icon: '🐋' },
          { name: 'Github',     url: 'https://github.com/166288',       icon: '🐙' },

          // 第二排 · 部分仅内网（lan: true 会显示绿点）
          { name: 'Router',     url: 'http://192.168.0.1/',             icon: '📡', lan: true },
          { name: 'Openlist',   url: 'http://192.168.0.200:1000/',      icon: '📂', lan: true },
          { name: 'EMBY',       url: 'http://192.168.0.200:8096/',      icon: '🎬', lan: true },
          { name: 'Reader',     url: 'http://192.168.0.200:2000/#/',    icon: '📖', lan: true },
          { name: 'TransText',  url: 'https://fanyi.baidu.com/mtpe-individual/transText#/', icon: '🌐' },
          { name: 'Makerworld', url: 'https://makerworld.com.cn/',      icon: '🖨️' }
        ],

        init() {
          const saved = localStorage.getItem('theme');
          this.theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          this.applyTheme();
          this.fetchWeather();

          // 窗口变宽到 md 以上时，自动收起移动端菜单
          window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) this.menuOpen = false;
          });
        },

        toggleTheme() {
          this.theme = this.theme === 'dark' ? 'light' : 'dark';
          this.applyTheme();
          localStorage.setItem('theme', this.theme);
        },

        applyTheme() {
          document.documentElement.classList.toggle('dark', this.theme === 'dark');
        },

        /* ---------- 复制微信号 ---------- */
        copyWechat() {
          const id = this.wechatId;
          const done = () => {
            this.wechatCopied = true;
            setTimeout(() => { this.wechatCopied = false; }, 1500);
          };

          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(id).then(done).catch(() => {
              this.fallbackCopy(id, done);
            });
          } else {
            this.fallbackCopy(id, done);
          }
        },

        fallbackCopy(text, done) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.setAttribute('readonly', '');
          document.body.appendChild(ta);
          ta.select();
          try {
            const ok = document.execCommand('copy');
            if (ok && done) done();
            else prompt('请手动复制微信号：', text);
          } catch (e) {
            prompt('请手动复制微信号：', text);
          }
          document.body.removeChild(ta);
        },

        /* ---------- 天气 ---------- */
        async fetchWeather() {
          try {
            const url = 'https://api.open-meteo.com/v1/forecast?latitude=33.96&longitude=118.28&current=temperature_2m,weather_code&timezone=Asia%2FShanghai';
            const res = await fetch(url);
            const data = await res.json();
            const code = data.current.weather_code;

            this.weather = {
              temp: Math.round(data.current.temperature_2m),
              desc: this.weatherDesc(code),
              icon: this.weatherIcon(code),
            };
          } catch (err) {
            this.weather = { temp: '--', desc: '天气不可用', icon: '🌤' };
          }
        },

        weatherDesc(code) {
          if (code === 0) return '晴';
          if ([1, 2, 3].includes(code)) return '多云';
          if ([45, 48].includes(code)) return '雾';
          if (code >= 51 && code <= 57) return '毛毛雨';
          if (code >= 61 && code <= 67) return '雨';
          if (code >= 71 && code <= 77) return '雪';
          if (code >= 80 && code <= 82) return '阵雨';
          if (code >= 95) return '雷暴';
          return '未知';
        },

        weatherIcon(code) {
          if (code === 0) return '☀️';
          if ([1, 2].includes(code)) return '🌤';
          if (code === 3) return '☁️';
          if ([45, 48].includes(code)) return '🌫';
          if (code >= 51 && code <= 67) return '🌧';
          if (code >= 71 && code <= 77) return '❄️';
          if (code >= 80 && code <= 82) return '🌦';
          if (code >= 95) return '⛈';
          return '🌤';
        },
      };
    }
  </script>
